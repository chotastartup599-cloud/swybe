<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Swybe - Learn from Toppers & Peers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <!-- ===== TOP BAR ===== -->
        <div class="top-bar">
            <div class="app-logo">Swybe</div>
            <div class="top-right">
                <button class="icon-btn" id="savesBtn" title="My Saves">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
                <div id="authArea">
                    <button class="login-btn" onclick="openLoginModal()">Login</button>
                </div>
            </div>
        </div>

        <!-- ===== SCREEN: FEED ===== -->
        <div class="screen" id="screen-feed"></div>

       <!-- ===== SCREEN: REELS ===== -->
        <div class="screen no-padding" id="screen-reels">
            <div class="reels-feed" id="peerTubeFeed"></div>
        </div>

        <!-- ===== SCREEN: SEARCH ===== -->
        <div class="screen" id="screen-search"></div>

        <!-- ===== SCREEN: UPLOAD ===== -->
        <div class="screen" id="screen-upload"></div>

        <!-- ===== SCREEN: PROFILE ===== -->
        <div class="screen" id="screen-profile"></div>

        <!-- ===== SCREEN: TESTS ===== -->
        <div class="screen" id="screen-tests"></div>

        <!-- ===== SCREEN: ADMIN DASHBOARD ===== -->
        <div class="screen" id="screen-admin"></div>

        <!-- ===== BOTTOM NAV ===== -->
        <nav class="bottom-nav">
            <button class="nav-item" data-nav="feed" title="Home">
                <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"></path></svg>
            </button>
            <button class="nav-item" data-nav="search" title="Search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="nav-item" data-nav="upload" title="Upload">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>
            <button class="nav-item active" data-nav="reels" title="Reels">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
            </button>
            <button class="nav-item" data-nav="profile" title="Profile">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
            </button>
        </nav>

                   <!-- ===== INSTAGRAM STYLE COMMENT POPUP ===== -->
        <div class="comment-section-popup" id="commentPopup">
            <div class="comment-header">
                Comments
                <span class="close-popup" onclick="closeCommentPopup()">✕</span>
            </div>
            <div class="comments-list" id="commentsList">
                <!-- Comments yaha dynamically load honge -->
            </div>
            
            <!-- Insta Style Input Box -->
            <div class="comment-input-box">
                <!-- Emoji Icon -->
                <div class="input-emoji-btn" onclick="showToast('Emoji picker coming soon! 😊')">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                </div>
                
                <div class="comment-input-wrapper">
                    <input type="text" id="cInput" placeholder="Add a comment...">
                </div>
                
                <button id="cBtn" disabled>Post</button>
            </div>
        </div>
        <!-- ===== TOAST ===== -->
        <div class="toast" id="toast"></div>

    </div>

    <!-- ===== SCRIPTS ===== -->
    <!-- 1. Firebase SDK (Login ke liye) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- 2. Config Files -->
    <script src="config.js"></script>
    <script src="firebase-config.js"></script>
    <script src="data.js"></script>

    <!-- 3. Main App Logic -->
    <script src="app.js"></script>

    <!-- 4. Modules (Features) -->
    <script src="modules/feed.js"></script>
    <script src="modules/reels.js"></script>
    <script src="modules/stories.js"></script>
    <script src="modules/login.js"></script>
    <script src="modules/profile.js"></script>
    <script src="modules/upload.js"></script>
    <script src="modules/search.js"></script>
    <script src="modules/tests.js"></script>
    <script src="modules/admin.js"></script>

</body>
</html>
